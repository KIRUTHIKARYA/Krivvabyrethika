<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invoice — KRIVVA BY RETHIKA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500;600;700&display=swap');

    body {
      background: radial-gradient(circle at center, #6b1e19 0%, #300806 100%);
      font-family: 'Jost', sans-serif;
      color: #1a2e3b;
      margin: 0;
      padding: 50px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    .invoice-container {
      background-color: #fcfbf8;
      width: 100%;
      max-width: 680px;
      border-radius: 340px 340px 0 0;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
      padding: 100px 70px 70px 70px;
      box-sizing: border-box;
      position: relative;
      border: 1px solid rgba(196, 143, 67, 0.25);
    }

    /* Mandala Logo Styling */
    .mandala-container {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }

    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.3rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 5px;
      color: #1a2e3b;
      text-align: center;
      margin: 0 0 6px 0;
      line-height: 1.1;
    }

    .brand-subtitle {
      font-family: 'Jost', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #c48f43;
      text-align: center;
      margin: 0 0 50px 0;
    }

    /* Metadata details */
    .metadata-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 45px;
    }

    .meta-left, .meta-right {
      display: flex;
      flex-direction: column;
    }

    .meta-label {
      font-family: 'Jost', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: #8c9ba5;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .meta-value {
      font-family: 'Jost', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1a2e3b;
    }

    .customer-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: #c48f43;
      text-align: right;
      line-height: 1.1;
    }

    .customer-subtitle {
      font-family: 'Jost', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      color: #1a2e3b;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: right;
      margin-top: 4px;
    }

    /* Items Table */
    .items-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 40px;
    }

    .items-table th {
      font-family: 'Jost', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: #1a2e3b;
      letter-spacing: 1.5px;
      padding: 14px 0;
      border-top: 1.5px solid #c48f43;
      border-bottom: 1.5px solid #c48f43;
    }

    .items-table td {
      font-family: 'Jost', sans-serif;
      font-size: 0.92rem;
      color: #4a5a65;
      padding: 20px 0;
      border-bottom: 1px solid rgba(196, 143, 67, 0.15);
      vertical-align: middle;
    }

    /* Total calculations summary */
    .summary-container {
      width: 100%;
      max-width: 320px;
      margin-left: auto;
      margin-bottom: 50px;
      border-top: 1.5px solid #c48f43;
      padding-top: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-family: 'Jost', sans-serif;
      font-size: 0.92rem;
      color: #4a5a65;
    }

    .summary-row.total-row {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(196, 143, 67, 0.35);
      font-size: 1.25rem;
      font-weight: 700;
      color: #1a2e3b;
    }

    /* Bottom Section Billing */
    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-top: 1px solid rgba(196, 143, 67, 0.18);
      padding-top: 35px;
    }

    .billing-details, .payment-details {
      width: 46%;
      display: flex;
      flex-direction: column;
    }

    .billing-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #c48f43;
      margin-bottom: 8px;
    }

    .billing-addr {
      font-family: 'Jost', sans-serif;
      font-size: 0.88rem;
      color: #4a5a65;
      line-height: 1.55;
    }

    .payment-item {
      display: flex;
      justify-content: space-between;
      font-family: 'Jost', sans-serif;
      font-size: 0.88rem;
      margin-bottom: 6px;
      color: #4a5a65;
    }

    .payment-lbl {
      font-weight: 500;
    }

    .payment-val {
      font-weight: 700;
      color: #c48f43;
    }

    /* Floating Print Button */
    .print-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background-color: #c48f43;
      color: white;
      border: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .print-btn:hover {
      background-color: #a87630;
      transform: scale(1.1);
    }

    /* Print Stylesheet */
    @media print {
      body {
        background: none !important;
        padding: 0;
        margin: 0;
        display: block;
      }
      .invoice-container {
        border: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        padding: 40px 0 !important;
      }
      .print-btn {
        display: none !important;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 10px;
      }
      .invoice-container {
        border-radius: 180px 180px 0 0;
        padding: 70px 25px 40px 25px;
      }
      .brand-title {
        font-size: 1.8rem;
      }
      .metadata-row {
        flex-direction: column;
        gap: 20px;
        margin-bottom: 30px;
      }
      .meta-right {
        align-items: flex-start;
      }
      .customer-name, .customer-subtitle {
        text-align: left;
      }
      .bottom-row {
        flex-direction: column;
        gap: 30px;
      }
      .billing-details, .payment-details {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="invoice-container">
    <!-- SVG Mandala Header Icon -->
    <div class="mandala-container">
      <svg width="60" height="60" viewBox="0 0 100 100">
        <!-- Circular details -->
        <circle cx="50" cy="50" r="45" fill="none" stroke="#c48f43" stroke-width="1" />
        <circle cx="50" cy="50" r="41" fill="none" stroke="#c48f43" stroke-width="0.5" stroke-dasharray="2 1" />
        <circle cx="50" cy="50" r="12" fill="none" stroke="#c48f43" stroke-width="1.2" />
        
        <!-- Large Petals -->
        <g stroke="#c48f43" stroke-width="0.8" fill="none">
          <path d="M 50 5 C 55 25, 45 25, 50 5" transform="rotate(0 50 50)" />
          <path d="M 50 5 C 55 25, 45 25, 50 5" transform="rotate(30 50 50)" />
          <path d="M 50 5 C 55 25, 45 25, 50 5" transform="rotate(60 50 50)" />
          <path d="M 50 5 C 55 25, 45 25, 50 5" transform="rotate(90 50 50)" />
          <path d="M 50 5 C 55 25, 45 25, 50 5" transform="rotate(120 50 50)" />
          <path d="M 50 5 C 55 25, 45 25, 50 5" transform="rotate(150 50 50)" />
          <path d="M 50 5 C 55 25, 45 25, 50 5" transform="rotate(180 50 50)" />
          <path d="M 50 5 C 55 25, 45 25, 50 5" transform="rotate(210 50 50)" />
          <path d="M 50 5 C 55 25, 45 25, 50 5" transform="rotate(240 50 50)" />
          <path d="M 50 5 C 55 25, 45 25, 50 5" transform="rotate(270 50 50)" />
          <path d="M 50 5 C 55 25, 45 25, 50 5" transform="rotate(300 50 50)" />
          <path d="M 50 5 C 55 25, 45 25, 50 5" transform="rotate(330 50 50)" />

          <!-- Small Petals -->
          <path d="M 50 15 C 53 30, 47 30, 50 15" transform="rotate(15 50 50)" stroke-width="0.5" />
          <path d="M 50 15 C 53 30, 47 30, 50 15" transform="rotate(45 50 50)" stroke-width="0.5" />
          <path d="M 50 15 C 53 30, 47 30, 50 15" transform="rotate(75 50 50)" stroke-width="0.5" />
          <path d="M 50 15 C 53 30, 47 30, 50 15" transform="rotate(105 50 50)" stroke-width="0.5" />
          <path d="M 50 15 C 53 30, 47 30, 50 15" transform="rotate(135 50 50)" stroke-width="0.5" />
          <path d="M 50 15 C 53 30, 47 30, 50 15" transform="rotate(165 50 50)" stroke-width="0.5" />
          <path d="M 50 15 C 53 30, 47 30, 50 15" transform="rotate(195 50 50)" stroke-width="0.5" />
          <path d="M 50 15 C 53 30, 47 30, 50 15" transform="rotate(225 50 50)" stroke-width="0.5" />
          <path d="M 50 15 C 53 30, 47 30, 50 15" transform="rotate(255 50 50)" stroke-width="0.5" />
          <path d="M 50 15 C 53 30, 47 30, 50 15" transform="rotate(285 50 50)" stroke-width="0.5" />
          <path d="M 50 15 C 53 30, 47 30, 50 15" transform="rotate(315 50 50)" stroke-width="0.5" />
          <path d="M 50 15 C 53 30, 47 30, 50 15" transform="rotate(345 50 50)" stroke-width="0.5" />
        </g>
        <circle cx="50" cy="50" r="3.5" fill="#c48f43" />
      </svg>
    </div>

    <!-- Company Headers -->
    <div class="brand-title">KRIVVA BY RETHIKA</div>
    <div class="brand-subtitle">WOMENSWEAR & STYLING</div>

    <!-- Metadata Details Row -->
    <div class="metadata-row">
      <div class="meta-left">
        <div class="meta-label">NO.</div>
        <div class="meta-value" id="inv-no">-</div>
        <div style="margin-top: 15px;"></div>
        <div class="meta-label">DATE.</div>
        <div class="meta-value" id="inv-date">-</div>
      </div>
      <div class="meta-right">
        <div class="meta-label" style="text-align: right;">INVOICE TO</div>
        <div class="customer-name" id="inv-customer">-</div>
        <div class="customer-subtitle">CUSTOMER</div>
      </div>
    </div>

    <!-- Items Table -->
    <table class="items-table">
      <thead>
        <tr>
          <th style="width: 10%; text-align: left;">QTY</th>
          <th style="text-align: left;">DESCRIPTION</th>
          <th style="width: 15%; text-align: center;">SIZE</th>
          <th style="width: 20%; text-align: right;">RATE</th>
          <th style="width: 25%; text-align: right;">AMOUNT</th>
        </tr>
      </thead>
      <tbody id="invoice-items">
        <!-- Rendered dynamically -->
      </tbody>
    </table>

    <!-- Totals Summary Container -->
    <div class="summary-container">
      <div class="summary-row">
        <span>Sub-total:</span>
        <span id="subtotal-val">₹0.00</span>
      </div>
      <div class="summary-row" id="shipping-row">
        <span>Shipping:</span>
        <span id="shipping-val">₹0.00</span>
      </div>
      <div class="summary-row">
        <span>CGST (0%):</span>
        <span id="cgst-val">₹0.00</span>
      </div>
      <div class="summary-row">
        <span>SGST (0%):</span>
        <span id="sgst-val">₹0.00</span>
      </div>
      <div class="summary-row total-row">
        <span>Total:</span>
        <span id="total-val">₹0.00</span>
      </div>
    </div>

    <!-- Bottom Billing & Payment details -->
    <div class="bottom-row">
      <div class="billing-details">
        <div class="bottom-label">Billed To</div>
        <div class="billing-name" id="billing-name">-</div>
        <div class="billing-addr" id="billing-address">-</div>
      </div>
      <div class="payment-details">
        <div class="bottom-label">Payment Details</div>
        <div class="payment-item">
          <span class="payment-lbl">Status:</span>
          <span class="payment-val" id="payment-status">PAID</span>
        </div>
        <div class="payment-item">
          <span class="payment-lbl">Date:</span>
          <span class="payment-val" id="payment-date">-</span>
        </div>
        <div style="margin-top: 25px; font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; font-weight: 700; color: #1a2e3b; letter-spacing: 0.5px;">
          Team KRIVVA BY RETHIKA 🤍
        </div>
      </div>
    </div>
  </div>

  <!-- Float Print Button -->
  <button class="print-btn" onclick="window.print()" title="Print Invoice">🖨️</button>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data');
        if (!dataParam) {
          document.body.innerHTML = `
            <div style="color: white; text-align: center; font-family: 'Jost', sans-serif; padding: 50px;">
              <h2>No invoice data provided.</h2>
              <p>Please open this page using the link generated from the Admin panel or My Orders page.</p>
            </div>`;
          return;
        }

        const order = JSON.parse(decodeURIComponent(escape(atob(dataParam))));

        // Show invoice/order reference — use existing ID if it looks like INV-XXXX, else show as ORDER ref
        const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(order.id);
        const invId = isUuid
          ? 'ORD-' + order.id.substring(0, 8).toUpperCase()
          : order.id;

        document.getElementById('inv-no').textContent = invId;

        // Formatted dates — handle both 'DD Mon YYYY' string and ISO timestamp
        const dateRaw = order.date || order.created_at || new Date().toISOString();
        const d = new Date(dateRaw);
        if (!isNaN(d.getTime())) {
          const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
          document.getElementById('inv-date').textContent = `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
          const shortMonths = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          document.getElementById('payment-date').textContent = `${d.getDate()} ${shortMonths[d.getMonth()]} ${d.getFullYear()}`;
        }

        document.getElementById('inv-customer').textContent = order.name;
        document.getElementById('billing-name').textContent = order.name;

        // Billing address formatting
        let addrHTML = `${order.addr || ''}`;
        if (order.city) addrHTML += `<br>${order.city}`;
        if (order.pin) addrHTML += `, PIN: ${order.pin}`;
        if (order.phone) addrHTML += `<br>Phone: +91 ${order.phone}`;
        document.getElementById('billing-address').innerHTML = addrHTML;

        // Render line items
        const itemsContainer = document.getElementById('invoice-items');
        itemsContainer.innerHTML = order.items.map(item => {
          const qty = item.qty || 1;
          const rate = item.price || 0;
          const amt = qty * rate;
          const sizeStr = item.size ? item.size : 'M';
          return `
            <tr>
              <td style="text-align: left;">${qty}</td>
              <td style="text-align: left; font-weight: 500; color: #1a2e3b;">${item.name}</td>
              <td style="text-align: center;">${sizeStr}</td>
              <td style="text-align: right;">₹${rate.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
              <td class="amount-col" style="text-align: right;">₹${amt.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
            </tr>`;
        }).join('');

        // Totals Calculations mapping
        const subtotalVal = order.subtotal || order.items.reduce((sum, item) => sum + (item.price * item.qty), 0);
        const shippingVal = order.shipping !== undefined ? order.shipping : (order.total >= 999 ? 0 : 99);
        const cgstVal = order.cgst || 0;
        const sgstVal = order.sgst || 0;

        document.getElementById('subtotal-val').textContent = `₹${subtotalVal.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        document.getElementById('shipping-val').textContent = `₹${shippingVal.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        document.getElementById('cgst-val').textContent = `₹${cgstVal.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        document.getElementById('sgst-val').textContent = `₹${sgstVal.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        document.getElementById('total-val').textContent = `₹${order.total.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

      } catch (err) {
        console.error(err);
        document.body.innerHTML = `
          <div style="color: white; text-align: center; font-family: 'Jost', sans-serif; padding: 50px;">
            <h2>Error parsing invoice data.</h2>
            <p>The billing URL appears to be formatted incorrectly or contains corrupt data.</p>
          </div>`;
      }
    });
  </script>
</body>
</html>
